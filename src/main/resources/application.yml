spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skypro_ads
    username: username
    password: password
    driver-class-name: org.postgresql.Driver

  # ВАЖНО: Включаем Liquibase!
  liquibase:
    change-log: classpath:db/changelog/master.yml
    # enabled: true # По умолчанию true, можно не писать явно

  jpa:
    hibernate:
      ddl-auto: none # Обязательно none, иначе Hibernate и Liquibase будут драться за создание таблиц
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080